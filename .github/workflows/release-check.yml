name: Verify draft map release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Draft release tag, e.g. br-maps-v2026.09.0
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify-draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Resolve draft release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^br-maps-v[0-9]{4}\.[0-9]{2}\.[0-9]+$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          release_id="$({ gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100"; } | jq -r --arg tag "$RELEASE_TAG" '.[] | select(.tag_name == $tag and .draft == true) | .id' | head -n 1)"
          if [[ -z "$release_id" ]]; then
            echo "Draft release not found for tag $RELEASE_TAG" >&2
            exit 1
          fi
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"

      - name: Download draft release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.release.outputs.release_id }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-staging
          gh api --paginate "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets?per_page=100" \
            --jq '.[] | [.id, .name] | @tsv' > /tmp/map-release-assets.tsv
          while IFS=$'\t' read -r asset_id asset_name; do
            [[ -z "$asset_id" ]] && continue
            if [[ "$asset_name" == *"/"* || "$asset_name" == *"\\"* || "$asset_name" == *".."* ]]; then
              echo "Unsafe release asset name: $asset_name" >&2
              exit 1
            fi
            gh api -H 'Accept: application/octet-stream' "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" > "release-staging/${asset_name}"
          done < /tmp/map-release-assets.tsv

      - name: Require release manifest
        shell: bash
        run: test -f release-staging/maps-manifest.json

      - name: Require checksums when PMTiles exist
        shell: bash
        run: |
          set -euo pipefail
          if compgen -G 'release-staging/*.pmtiles' > /dev/null; then
            test -f release-staging/SHA256SUMS.txt
          fi

      - name: Validate release manifest
        run: node scripts/validate-manifest.mjs release-staging/maps-manifest.json catalog/states.json

      - name: Verify release assets
        run: node scripts/verify-release.mjs --manifest release-staging/maps-manifest.json --assets release-staging
