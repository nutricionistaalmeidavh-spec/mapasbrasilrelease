name: Publish Mapas Brasil 2026.09.1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-2026-09-1.yml'

permissions:
  contents: write

concurrency:
  group: publish-mapas-brasil-2026-09-1
  cancel-in-progress: false

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install repository dependencies
        run: npm ci

      - name: Resolve the intended draft release only
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" > /tmp/releases.json
          release_id=$(jq -r '[.[] | select(.name == "Mapas Brasil 2026.09.1" and .draft == true)] | if length == 1 then .[0].id else empty end' /tmp/releases.json)
          if [[ "$release_id" != "392491423" ]]; then
            echo "Expected the single draft Mapas Brasil 2026.09.1 to be release 392491423; got ${release_id:-none}." >&2
            exit 1
          fi
          if jq -e '.[] | select(.draft == false and .tag_name == "br-maps-v2026.09.1")' /tmp/releases.json >/dev/null; then
            echo 'A published br-maps-v2026.09.1 already exists; refusing duplicate publication.' >&2
            exit 1
          fi
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"

      - name: Validate the complete release index and manifest
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.release.outputs.release_id }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets?per_page=100" > /tmp/release-assets.json
          count=$(jq 'length' /tmp/release-assets.json)
          if [[ "$count" -ne 31 ]]; then
            echo "Expected exactly 31 final assets (28 PMTiles + 3 control files), got $count." >&2
            jq -r '.[].name' /tmp/release-assets.json >&2
            exit 1
          fi

          pmtiles_count=$(jq '[.[] | select(.name | endswith(".pmtiles"))] | length' /tmp/release-assets.json)
          if [[ "$pmtiles_count" -ne 28 ]]; then
            echo "Expected 28 PMTiles assets, got $pmtiles_count." >&2
            exit 1
          fi

          for required in maps-manifest.json SHA256SUMS.txt SOURCE_INFO.json; do
            jq -e --arg name "$required" 'any(.[]; .name == $name)' /tmp/release-assets.json >/dev/null
          done

          manifest_id=$(jq -r '.[] | select(.name == "maps-manifest.json") | .id' /tmp/release-assets.json)
          gh api -H 'Accept: application/octet-stream' "repos/${GITHUB_REPOSITORY}/releases/assets/${manifest_id}" > /tmp/maps-manifest.json

          node scripts/validate-manifest.mjs /tmp/maps-manifest.json catalog/states.json
          jq -e '.releaseVersion == "2026.09.1"' /tmp/maps-manifest.json >/dev/null
          available=$(jq '[.maps[] | select(.available == true)] | length' /tmp/maps-manifest.json)
          if [[ "$available" -ne 28 ]]; then
            echo "Manifest must expose all 28 packages; got $available." >&2
            exit 1
          fi

          node scripts/verify-release-index.mjs \
            --manifest /tmp/maps-manifest.json \
            --assets /tmp/release-assets.json \
            --require-all true

      - name: Correct release tag and publish atomically
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.release.outputs.release_id }}
        shell: bash
        run: |
          set -euo pipefail
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/br-maps-v2026.09.1" >/dev/null 2>&1; then
            echo 'Tag br-maps-v2026.09.1 already exists; refusing to retarget it.' >&2
            exit 1
          fi

          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
            -f tag_name='br-maps-v2026.09.1' \
            -f target_commitish='main' \
            -f name='Mapas Brasil 2026.09.1' \
            -F draft=false \
            -F prerelease=false >/tmp/published-release.json

          jq -e '.id == 392491423 and .draft == false and .prerelease == false and .tag_name == "br-maps-v2026.09.1"' /tmp/published-release.json >/dev/null

      - name: Verify public latest-release contract used by Pecuaria
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/releases/latest" > /tmp/latest.json
          jq -e '.id == 392491423 and .draft == false and .tag_name == "br-maps-v2026.09.1"' /tmp/latest.json >/dev/null
          jq -e 'any(.assets[]; .name == "maps-manifest.json")' /tmp/latest.json >/dev/null
          jq -e 'any(.assets[]; .name == "sp.pmtiles")' /tmp/latest.json >/dev/null
          echo 'Mapas Brasil 2026.09.1 published and latest-release contract verified.'
